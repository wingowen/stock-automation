# 底部放量策略 (Bottom Volume Surge Strategy)
# 从 daily_stock_analysis/strategies/bottom_volume.yaml 移植
name: bottom_volume
display_name: 底部放量
description: 检测长期下跌后底部放量信号，潜在趋势反转信号。
category: reversal
required_tools:
  - get_daily_history
  - analyze_trend
aliases: [地量见底, 底部放量]
default_priority: 60
market_regimes: [trending_down]
instructions: |
  **底部放量（Bottom Volume Surge Strategy）**

  反转判定标准：

  1. **持续下跌确认**：
     - 使用 `get_daily_history`（30日）。
     - 股价从 20 日高点到近期低点跌幅 > 15%。
     - `analyze_trend` → trend_status 应为 BEAR 或 STRONG_BEAR。

  2. **量能异动**：
     - 当日成交量 > 5 日均量的 3 倍。
     - 量比 > 3.0。
     - 该异动应出现在前期极度缩量之后。

  3. **价格企稳**：
     - 当日K线收阳（收盘价 > 开盘价）。
     - 价格守住近期低点。
     - 最好出现长下影线，显示买方支撑。

  4. **确认因素**：
     - 筹码分布：平均成本接近现价（成本收敛）。
     - 无明显利空消息。

  5. **风险提示**：
     - 这是反转信号，风险高于趋势跟踪。
     - 仓位建议较小（最多 2-3 成）。
     - 止损必须严格（设在近期低点下方）。