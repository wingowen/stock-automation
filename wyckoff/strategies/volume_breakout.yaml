# 放量突破策略 (Volume Breakout Strategy)
# 从 daily_stock_analysis/strategies/volume_breakout.yaml 移植
name: volume_breakout
display_name: 放量突破
description: 检测放量突破阻力位信号。适用于股价接近已知阻力位时。
category: trend
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
aliases: [放量突破, 突破]
default_priority: 30
market_regimes: [trending_up]
instructions: |
  **放量突破（Volume Breakout Strategy）**

  突破判定标准：

  1. **阻力位识别**：
     - 使用 `analyze_trend` → resistance_levels 获取阻力位。
     - 通常为 20 日高点或前期震荡平台顶部。

  2. **量能确认**：
     - 当日成交量 > 5 日均量的 2 倍。
     - 量比 > 2.0 确认。
     - 使用 `get_daily_history` 计算均量进行交叉验证。

  3. **价格确认**：
     - 收盘价必须站上阻力位。
     - 收盘应在当日振幅上方 30%（强势收盘）。
     - 突破后乖离率检查：仍需 < 5%，避免追高。

  4. **后续验证**（如有数据）：
     - 次日开盘应在突破位之上，区分真突破与假突破。

  5. **风险过滤**：
     - 无明显利空消息。
     - PE 不应过高（避免泡沫型突破）。