# 威科夫 Spring 策略 (Wyckoff Spring Strategy)
# 基于《威科夫操盘法》第四章 - Spring 形态
name: wyckoff_spring
display_name: 威科夫弹簧效应
description: 检测威科夫吸筹阶段的 Spring (弹簧效应) 形态。
category: reversal
required_tools:
  - get_daily_history
  - analyze_trend
aliases: [弹簧效应, Spring, 终极震仓]
default_priority: 50
market_regimes: [trending_down, consolidation]
instructions: |
  **威科夫 Spring（弹簧效应/终极震仓）**

  Spring 是威科夫吸筹阶段最可靠的形态之一。

  判定标准：

  1. **吸筹区间背景**：
     - 价格处于前期下跌后的横盘震荡区间（吸筹区）。
     - 区间震荡至少 10 个交易日，高低点清晰。

  2. **Spring 触发**：
     - 价格跌破区间下沿（近期低点）。
     - 跌破幅度 0.5% - 5%（超过 5% 可能是大盘崩盘，非 Spring）。
     - 跌破后 1-3 根 K 线内收回区间内。
     - 收回时成交量放大 > 1.5 倍均量（恐慌抛售→买方吸收）。

  3. **量价确认**：
     - 跌破当日K线有长下影线（显示买方支撑）。
     - 收回日成交量明显放大（AR - Automatic Rally）。
     - 后续价格应站稳区间下沿之上。

  4. **强度评分**：
     - 跌破幅度 1-3% + 收回 1 天内 + 量能 2x+ → 强 Spring。
     - 跌破幅度 3-5% + 收回 2-3 天 + 量能 1.5x → 弱 Spring。

  5. **风险提示**：
     - Spring 是反转信号，但需要后续 SOS 确认。
     - 止损设在 Spring 低点下方 1-2%。
     - 仓位建议 2-3 成。