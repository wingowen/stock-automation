name: 模型对比评估

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "指定交易日 YYYY-MM-DD（可选，默认最近交易日）"
        required: false
  schedule:
    # 北京时间 17:30 ≈ UTC 09:30，在每日威科夫分析之后跑模型对照
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: model-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install pandas requests
          # 确保 skill 目录的 fetch_kline.py 可用（失败则 fail-fast，避免带病运行）
          bash .agents/skills/a-share-kline-fetch/setup_env.sh

      - name: 质量门禁 (lint + test)
        run: |
          pip install pytest ruff
          ruff check model-eval
          python -m pytest model-eval/tests

      - name: Run model eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_BASE_URL: ${{ secrets.AGNES_BASE_URL }}
          AGNES_MODEL: ${{ secrets.AGNES_MODEL }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
        run: |
          python model-eval/eval/cli.py ${{ github.event.inputs.trade_date && format('--trade-date {0}', github.event.inputs.trade_date) }}

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add model-eval/reports/
          if git diff --cached --quiet; then
            echo "无报告变化，跳过提交"
          else
            git commit -m "chore: 模型对比评估 $(date +%F)"
            git push
          fi
