name: 威科夫每日信号扫描

on:
  schedule:
    # 北京时间 19:00（收盘后，数据源已更新）= UTC 11:00
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      trade_date:
        description: "指定交易日 YYYY-MM-DD（可选，默认最近交易日）"
        required: false
      days:
        description: "拉取数据天数（默认 120）"
        required: false
        default: "120"
      limit:
        description: "限制扫描数量（0=全部，测试用）"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: wyckoff-signal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # 全市场 ~3200 只 × (拉取+限流) ≈ 60-90 分钟；断点续扫使超时重跑只补未完成部分
    timeout-minutes: 180

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pandas akshare requests

      - name: 运行 LPS 信号扫描
        id: scan
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # 输入经 env 传入，避免 ${{ }} 直接内插进 shell
          INPUT_TRADE_DATE: ${{ github.event.inputs.trade_date }}
          INPUT_DAYS: ${{ github.event.inputs.days || '120' }}
          INPUT_LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          cd ${{ github.workspace }}
          DAYS="${INPUT_DAYS:-120}"
          LIMIT="${INPUT_LIMIT:-0}"
          TRADE_DATE="${INPUT_TRADE_DATE:-}"

          echo "=========================================="
          echo "威科夫 LPS 信号扫描"
          echo "交易日: ${TRADE_DATE:-（自动）}  days: ${DAYS}  limit: ${LIMIT}"
          echo "=========================================="

          if [ -n "$TRADE_DATE" ]; then
            python -m wyckoff.mainboard_scanner \
              --trade-date "$TRADE_DATE" \
              --days "$DAYS" \
              --limit "$LIMIT"
          else
            python -m wyckoff.mainboard_scanner \
              --days "$DAYS" \
              --limit "$LIMIT"
          fi

      - name: 上传扫描结果
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wyckoff-scan-results-${{ github.run_number }}
          path: wyckoff/scan_results/
          retention-days: 30
          # 无信号日不写 JSON（DB 已持久化），artifact 为空不算失败
          if-no-files-found: ignore
